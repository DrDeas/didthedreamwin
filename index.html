    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red:       #E31837;

            --red-glow:  rgba(227,24,55,0.40);

        .hero { text-align: center; padding: 56px 24px 32px; }

        .hero-answer.state-loading { color: var(--muted2); }

        .hero-answer.state-live { color: var(--sky); animation: livePulse 2s ease-in-out infinite; }
        @keyframes livePulse { 0%,100% { text-shadow: 0 0 80px rgba(80,145,204,0.3); } 50% { text-shadow: 0 0 140px rgba(80,145,204,0.55); } }
        .hero-answer { opacity: 0; transform: translateY(12px); }

        .sdot.atl-l { background: var(--bg3); color: var(--slate); border: 1px solid var(--border2); }
        .sdot.tbd { background: var(--bg); color: var(--muted2); border: 1px dashed var(--border2); }

        /* standings */
        .standings-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        .standings-table th { font-size: 0.54rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; text-align: center; }
        .standings-table th:first-child { text-align: left; }
        .standings-table td { padding: 9px 8px; text-align: center; font-variant-numeric: tabular-nums; border-top: 1px solid var(--border); color: var(--white); }
        .standings-table td:first-child { text-align: left; }
        .standings-table tr.is-dream { background: var(--red-dim); }
        .standings-table tr.is-dream td:first-child { color: var(--red); font-weight: 700; }
        .standings-rank { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }

        /* game log */
        .game-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border); gap: 12px; opacity: 0; transform: translateY(8px); transition: opacity 0.4s ease, transform 0.4s ease; }

        .pill.w { background: var(--red-dim); color: var(--red); }
        .pill.l { background: var(--slate-dim); color: var(--slate); }
        .row-opp { font-family: 'Anton', sans-serif; font-size: 1.1rem; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
        .row-ha { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); margin-right: 2px; }
        .row-ctx { font-size: 0.58rem; color: var(--muted); letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-score { font-family: 'Anton', sans-serif; font-size: 1.1rem; letter-spacing: 0.02em; }

        .skel { background: linear-gradient(90deg, var(--bg3) 25%, #222 50%, var(--bg3) 75%); background-size: 400% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 3px; }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    <a href="/" class="logo">DIDTHE<em>DREAM</em>WIN<em>.</em>COM</a>

</header>

<div id="ticker-wrap"><div class="ticker-inner"><div class="ticker-track" id="ticker-track" aria-hidden="true"></div></div></div>

<script>
/* ── CONFIG ── */
const DREAM_ID = '20';
const SEASON   = '2026';
const SCHEDULE_PLAYOFF = `https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/teams/${DREAM_ID}/schedule?seasontype=3&season=${SEASON}`;
const SCHEDULE_FULL    = `https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/teams/${DREAM_ID}/schedule?season=${SEASON}`;
const SCOREBOARD_URL   = 'https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard';
const SUMMARY_URL = (id) => `https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/summary?event=${id}`;
const STANDINGS_URL = `https://site.api.espn.com/apis/v2/sports/basketball/wnba/standings?season=${SEASON}`;

const DREAM_COLOR = '#E31837';
const OPP_COLOR   = '#8A8A92';

/* ── CONFETTI ── */
function fireConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    const W = canvas.width = window.innerWidth, H = canvas.height = window.innerHeight;
    const COLORS = ['#E31837','#E31837','#5091CC','#FFFFFF','#F2545B'];
    const pieces = Array.from({ length: 180 }, () => ({
        x: Math.random()*W, y: -10-Math.random()*80, w: Math.random()*9+4, h: Math.random()*4+2,
        c: COLORS[Math.floor(Math.random()*COLORS.length)], vx:(Math.random()-0.5)*5, vy: Math.random()*5+2,
        r: Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.18, a:1,
    }));
    let t = 0;
    function draw() {
        ctx.clearRect(0,0,W,H);
        for (const p of pieces) {
            p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
            if (p.y > H*0.65) p.a = Math.max(0, p.a-0.025);
            if (p.a <= 0) continue;
            ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=p.a;
            ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
        }
        if (++t < 280) requestAnimationFrame(draw); else ctx.clearRect(0,0,W,H);
    }
    draw();
}

/* ── TICKER ── */

/* ── SCORING TREND (with interactive scrubber) ── */
let trendState = null;
const periodLabel = p => p <= 4 ? `Q${p}` : `OT${p-4}`;

function renderTrend(plays, dreamIsHome, finalDream, finalOpp, dreamAbbr, oppAbbr) {
    show('trend-section');
    const card = document.getElementById('trend-card');
    trendState = null;
    if (!plays || plays.length === 0) { card.innerHTML = `<div class="trend-empty">Play-by-play not available for this game.</div>`; return; }
    const pts = [];
    for (const p of plays) {
        if (p.homeScore == null || p.awayScore == null) continue;
        pts.push({
            dream: dreamIsHome ? p.homeScore : p.awayScore,
            opp:   dreamIsHome ? p.awayScore : p.homeScore,
            period: p.period?.number || 1,
            clock:  p.clock?.displayValue || null,
        });
    }
    if (pts.length < 2) { card.innerHTML = `<div class="trend-empty">Not enough scoring data to chart.</div>`; return; }

    const W=680, H=300, padL=38, padR=16, padT=16, padB=30;
    const innerW=W-padL-padR, innerH=H-padT-padB, n=pts.length;
    const maxScore = Math.max(finalDream, finalOpp, ...pts.map(p=>Math.max(p.dream,p.opp))) + 4;
    const x = i => padL + (i/(n-1))*innerW;
    const y = s => padT + innerH - (s/maxScore)*innerH;
    const linePath = key => pts.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)} ${y(p[key]).toFixed(1)}`).join(' ');

    const periodMarks = [];
    let lastPeriod = pts[0].period;
    for (let i=1;i<n;i++){ if (pts[i].period!==lastPeriod){ periodMarks.push({i,period:pts[i].period}); lastPeriod=pts[i].period; } }

    let grid='';
    const ySteps=4;
    for (let g=0; g<=ySteps; g++){
        const val=Math.round((maxScore/ySteps)*g), yy=y(val);
        grid += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#1F1F22" stroke-width="1"/>`;
        grid += `<text x="${padL-8}" y="${(yy+4).toFixed(1)}" fill="#6B6B70" font-size="11" text-anchor="end" font-family="Inter,sans-serif">${val}</text>`;
    }
    let dividers='', prevX=padL, prevP=pts[0].period;
    for (const m of periodMarks){
        const mx=x(m.i);
        dividers += `<line x1="${mx.toFixed(1)}" y1="${padT}" x2="${mx.toFixed(1)}" y2="${padT+innerH}" stroke="#1F1F22" stroke-width="1" stroke-dasharray="3 3"/>`;
        dividers += `<text x="${((prevX+mx)/2).toFixed(1)}" y="${H-10}" fill="#6B6B70" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">${periodLabel(prevP)}</text>`;
        prevX=mx; prevP=m.period;
    }
    dividers += `<text x="${((prevX+(W-padR))/2).toFixed(1)}" y="${H-10}" fill="#6B6B70" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">${periodLabel(prevP)}</text>`;

    card.innerHTML = `
      <div class="trend-legend">
        <div class="trend-leg-item"><span class="trend-leg-dot" style="background:${DREAM_COLOR}"></span>Dream ${finalDream}</div>
        <div class="trend-leg-item"><span class="trend-leg-dot" style="background:${OPP_COLOR}"></span>Opponent ${finalOpp}</div>
      </div>
      <div class="trend-chart" id="trend-chart">
        <svg id="trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Scoring trend chart. Final score: Dream ${finalDream}, opponent ${finalOpp}.">
          ${grid}${dividers}
          <path d="${linePath('opp')}" fill="none" stroke="${OPP_COLOR}" stroke-width="2" stroke-linejoin="round"/>
          <path d="${linePath('dream')}" fill="none" stroke="${DREAM_COLOR}" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
        <div class="trend-guide" id="trend-guide"></div>
        <div class="trend-dot opp" id="trend-dot-opp"></div>
        <div class="trend-dot dream" id="trend-dot-dream"></div>
        <div class="trend-tip" id="trend-tip">
          <div class="tip-time" id="tip-time"></div>
          <div class="tip-row"><span class="tip-mk" style="background:${DREAM_COLOR}"></span><span class="tip-team">${dreamAbbr || 'ATL'}</span><span class="tip-score" id="tip-dream"></span></div>
          <div class="tip-row"><span class="tip-mk" style="background:${OPP_COLOR}"></span><span class="tip-team">${oppAbbr || 'OPP'}</span><span class="tip-score" id="tip-opp"></span></div>
        </div>
      </div>`;

    trendState = { pts, n, W, H, padL, padR, padT, innerW, innerH, maxScore, curIdx: n - 1 };
    wireScrubber();
    requestAnimationFrame(() => positionTrend(n - 1));
}

function positionTrend(idx) {
    const s = trendState; if (!s) return;
    const svg = document.getElementById('trend-svg'); if (!svg) return;
    const w = svg.clientWidth, h = svg.clientHeight; if (!w || !h) return;
    const sx = w / s.W, sy = h / s.H;
    const p = s.pts[idx];
    const vx  = s.padL + (idx/(s.n-1)) * s.innerW;
    const vyH = s.padT + s.innerH - (p.dream/s.maxScore) * s.innerH;
    const vyO = s.padT + s.innerH - (p.opp/s.maxScore) * s.innerH;
    const guide = document.getElementById('trend-guide');
    const dotH  = document.getElementById('trend-dot-dream');
    const dotO  = document.getElementById('trend-dot-opp');
    const tip   = document.getElementById('trend-tip');
    if (!guide || !tip) return;
    guide.style.left = (vx*sx)+'px'; guide.style.top = (s.padT*sy)+'px'; guide.style.height = (s.innerH*sy)+'px'; guide.style.opacity = 1;
    dotH.style.left = (vx*sx)+'px'; dotH.style.top = (vyH*sy)+'px'; dotH.style.opacity = 1;
    dotO.style.left = (vx*sx)+'px'; dotO.style.top = (vyO*sy)+'px'; dotO.style.opacity = 1;
    document.getElementById('tip-time').textContent  = periodLabel(p.period) + (p.clock ? ` · ${p.clock}` : '');
    document.getElementById('tip-dream').textContent = p.dream;
    document.getElementById('tip-opp').textContent   = p.opp;
    tip.style.opacity = 1;
    const tipW = tip.offsetWidth || 120;
    let left = vx*sx + 14;
    if (left + tipW > w) left = vx*sx - tipW - 14;
    if (left < 0) left = 2;
    tip.style.left = left + 'px';
    s.curIdx = idx;
}

function scrubFromClientX(clientX) {
    const s = trendState; if (!s) return;
    const svg = document.getElementById('trend-svg');
    const rect = svg.getBoundingClientRect(); if (!rect.width) return;
    const plotLeft = (s.padL / s.W) * rect.width;
    const plotW    = (s.innerW / s.W) * rect.width;
    let frac = (clientX - rect.left - plotLeft) / plotW;
    frac = Math.max(0, Math.min(1, frac));
    positionTrend(Math.round(frac * (s.n - 1)));
}

function wireScrubber() {
    const chart = document.getElementById('trend-chart'); if (!chart) return;
    chart.addEventListener('mousemove', e => scrubFromClientX(e.clientX));
    chart.addEventListener('mouseleave', () => { if (trendState) positionTrend(trendState.n - 1); });
    chart.addEventListener('touchstart', e => { if (e.touches[0]) scrubFromClientX(e.touches[0].clientX); }, { passive: true });
    chart.addEventListener('touchmove',  e => { if (e.touches[0]) scrubFromClientX(e.touches[0].clientX); }, { passive: true });
}

/* ── SERIES ── */
function renderSeries(games, oppName, seriesLen) {
    const wins = games.filter(g=>g.dreamWon).length, loss = games.filter(g=>!g.dreamWon).length;
    const nick = oppName.split(' ').pop();
    let leadTxt, leadCls;
    if (wins>loss){ leadTxt=`Dream lead ${wins}–${loss}`; leadCls='ahead'; }
    else if (loss>wins){ leadTxt=`Dream trail ${wins}–${loss}`; leadCls='behind'; }
    else { leadTxt=`Series tied ${wins}–${loss}`; leadCls='even'; }
    // Playoff series vary by round (R1 best-of-3, semis best-of-5, finals best-of-7).
    // seriesLen pads TBD slots when known; without it we show only the games played.
    const total = Math.max(seriesLen || 0, games.length);
    const dots = Array.from({length: total},(_,i)=>{
        const g = games[i];
        if (!g) return `<div class="sdot tbd"><span class="sdot-label">G${i+1}</span></div>`;
        const cls = g.dreamWon ? 'atl-w' : 'atl-l';
        return `<div class="sdot ${cls}" title="Game ${i+1}"><span class="sdot-label">G${i+1}</span><span class="sdot-result">${g.dreamWon?'W':'L'}</span></div>`;
    }).join('');
    document.getElementById('series-card').innerHTML = `
      <div class="series-top">
        <div class="series-name">ATL vs ${nick.toUpperCase()}</div>
        <div class="series-lead ${leadCls}">${leadTxt}</div>
      </div>
      <div class="series-dots">${dots}</div>`;
    show('series-section');
}

/* ── PARSE ── */
function parseEvent(evt) {
    const comp = evt.competitions?.[0];
    if (!comp) return null;
    const kSide = comp.competitors.find(c=>c.team.id===DREAM_ID);
    const oSide = comp.competitors.find(c=>c.team.id!==DREAM_ID);
    if (!kSide || !oSide) return null;
    function ps(raw){ if (raw==null||raw==='') return null; const v=(typeof raw==='object')?(raw.displayValue??raw.value):raw; const n=parseInt(v,10); return isNaN(n)?null:n; }
    const kScore=ps(kSide.score), oScore=ps(oSide.score);
    const dreamWon = kSide.winner===true?true : kSide.winner===false?false : (kScore!==null&&oScore!==null)?kScore>oScore:false;
    const gNum = evt.name?.match(/Game\s*(\d+)/i)?.[1];
    const round = comp.series?.summary || '';
    const seasonType = evt.seasonType?.type ?? evt.season?.type ?? comp.season?.type;
    const isPlayoff = seasonType === 3;
    const roundNote = (comp.notes || []).map(n => n && n.headline).find(Boolean) || '';
    const context = isPlayoff ? (roundNote || (gNum ? `WNBA Playoffs · Game ${gNum}` : (round || 'WNBA Playoffs'))) : 'Regular Season';
    // Team record can arrive as `records` or `record`, each an array of split objects
    // ({type:'total', summary:'46-36'}), a single object, or a plain string. Always return a string.
    function recOf(side) {
        const raw = side.records ?? side.record;
        if (!raw) return '';
        if (typeof raw === 'string') return raw;
        if (Array.isArray(raw)) {
            const entry = raw.find(r => r && (r.type === 'total' || r.abbreviation === 'Total')) || raw[0];
            return (entry && (entry.summary || entry.displayValue)) || '';
        }
        if (typeof raw === 'object') return raw.summary || raw.displayValue || '';
        return '';
    }
    return {
        id: evt.id, date: evt.date, dreamWon, context, isPlayoff, series: round,
        isHome: kSide.homeAway==='home',
        venue: comp.venue?.fullName || '',
        dream: { score:kScore, record: recOf(kSide), line: (kSide.linescores||[]).map(l=>ps(l.value??l.displayValue)) },
        opp: { score:oScore, name:oSide.team.displayName, short:oSide.team.shortDisplayName||oSide.team.displayName, abbrev: oSide.team.abbreviation || (oSide.team.displayName||'OPP').slice(0,3).toUpperCase(), record: recOf(oSide), line: (oSide.linescores||[]).map(l=>ps(l.value??l.displayValue)) },
    };
}

/* ── TICKER SEGMENTS ── */
function buildTickerSegments(game, summary) {
    const segs = ['DREAM WIN'];
    const oppNick = (game.opp.short || game.opp.name.split(' ').pop()).toUpperCase();
    if (game.dream.score!=null && game.opp.score!=null) segs.push(`FINAL: ATL ${game.dream.score} · ${oppNick} ${game.opp.score}`);
    if (game.context) segs.push(game.context.toUpperCase());
    if (summary?.leaders) {
        const lbl = { points:'PTS', rebounds:'REB', assists:'AST' };
        for (const cat of summary.leaders) {
            const label=lbl[cat.name]; if (!label) continue;
            const lead = (cat.leaders||[]).find(l=>l.team?.id===DREAM_ID);
            if (lead?.athlete?.shortName && lead.value) segs.push(`${lead.athlete.shortName.toUpperCase()}: ${lead.value} ${label}`);
        }
    }
    return segs;
}

/* Synthetic play-by-play for demo mode: monotonic series ending exactly at final, with game clock. */
function buildDemoPlays(dreamFinal, oppFinal, dreamIsHome) {
    const N = 81;
    const seq = (final) => {
        const raw = [0];
        for (let i = 1; i < N; i++) raw.push(raw[i-1] + (Math.random() > 0.4 ? (Math.random() > 0.7 ? 3 : 2) : 0));
        const last = raw[N-1] || 1;
        return raw.map(v => Math.round(v / last * final));
    };
    const dreamSeq = seq(dreamFinal), oppSeq = seq(oppFinal);
    const plays = [];
    for (let i = 0; i < N; i++) {
        const period = Math.min(4, Math.floor(i / 20) + 1);
        const stepInPeriod = i - (period - 1) * 20;
        const remain = Math.max(0, Math.round(600 * (1 - stepInPeriod / 20)));
        const clock = `${Math.floor(remain/60)}:${String(remain % 60).padStart(2,'0')}`;
        plays.push({
            homeScore: dreamIsHome ? dreamSeq[i] : oppSeq[i],
            awayScore: dreamIsHome ? oppSeq[i] : dreamSeq[i],
            period: { number: period },
            clock: { displayValue: clock },
        });
    }
    return plays;
}

/* ── STANDINGS FETCH (best-effort) ── */
async function loadStandings() {
    try {
        const data = await fetch(STANDINGS_URL).then(r=>r.json());
        // Walk the standings tree to find the conference group containing the Dream.
        function collectEntries(node, acc) {
            if (node?.standings?.entries) {
                for (const e of node.standings.entries) {
                    const stats = {}; for (const s of e.stats||[]) stats[s.name] = s.displayValue ?? s.value;
                    acc.push({ id: e.team?.id, name: e.team?.displayName || e.team?.name, group: node.name || '',
                        wins: stats.wins ?? '—', losses: stats.losses ?? '—', pct: stats.winPercent ?? stats.leagueWinPercent ?? '—', gb: stats.gamesBehind ?? '—' });
                }
            }
            for (const c of node?.children || []) collectEntries(c, acc);
        }
        const all = [];
        if (data.children) for (const c of data.children) collectEntries(c, all);
        else collectEntries(data, all);
        // find the group (conference) containing the Dream
        const dreamEntry = all.find(e => e.id === DREAM_ID);
        if (!dreamEntry) return;
        let group = all.filter(e => e.group === dreamEntry.group && dreamEntry.group);
        if (group.length < 2) group = all; // fallback: whole league
        group.sort((a,b) => (parseInt(b.wins)||0) - (parseInt(a.wins)||0));
        group.forEach((e,i) => e.rank = i + 1);
        let shown = group.slice(0, 6);
        if (!shown.some(e => e.id === DREAM_ID)) shown = group.slice(0, 5).concat(group.filter(e => e.id === DREAM_ID));
        renderStandings(shown, dreamEntry.group);
    } catch (e) { /* standings are optional — fail silently */ }
}

/* ── MAIN ── */
async function load() {
    const demoMode = new URLSearchParams(window.location.search).get('demo');
    if (demoMode === 'loss' || demoMode === 'win') { runDemo(demoMode); return; }

    try {
        const [playoffData, boardData] = await Promise.all([
            fetch(SCHEDULE_PLAYOFF).then(r=>r.ok?r.json():{events:[]}).catch(()=>({events:[]})),
            fetch(SCOREBOARD_URL).then(r=>r.json()).catch(()=>({})),
        ]);
        let schedData = playoffData;
        if ((schedData.events||[]).length === 0) schedData = await fetch(SCHEDULE_FULL).then(r=>r.json()).catch(()=>({events:[]}));

        const events = schedData.events || [];
        const completed = events.filter(e => {
            const s = e.competitions?.[0]?.status?.type || e.status?.type || {};
            return s.state==='post' || s.completed===true || s.name?.startsWith('STATUS_FINAL');
        });
        const parsed = completed.map(parseEvent).filter(Boolean);
        parsed.sort((a,b) => new Date(a.date) - new Date(b.date));

        const liveEvt = (boardData.events||[]).find(e =>
            e.competitions?.[0]?.competitors?.some(c=>c.team.id===DREAM_ID) &&
            e.competitions?.[0]?.status?.type?.state==='in');

        let latest = null;
        if (liveEvt) {
            document.getElementById('game-label').textContent = 'Live Now';
            latest = parseEvent(liveEvt);
            if (latest) {
                renderScoreCard(latest, true);
                const clock = liveEvt.competitions[0].status;
                const clockEl = document.getElementById('live-clock');
                if (clockEl && clock?.displayClock) clockEl.textContent = `${clock.displayClock} · Q${clock.period||'?'}`;
            }
            setAnswer('live', `Live at <strong>${latest?.venue || 'the arena'}</strong>`);
        } else if (parsed.length > 0) {
            latest = parsed[parsed.length-1];
            renderScoreCard(latest, false);
            const sub = latest.dreamWon
                ? `<strong>Atlanta</strong> beat the ${latest.opp.short} ${latest.dream.score}–${latest.opp.score}`
                : `<strong>Atlanta</strong> fell to the ${latest.opp.short} ${latest.dream.score}–${latest.opp.score}`;
            setAnswer(latest.dreamWon ? 'win':'loss', sub);
            renderLineScore(latest.dream.line, latest.opp.line, latest.opp.short, latest.dream.score, latest.opp.score);
        } else {
            document.getElementById('score-card').innerHTML = '<div class="error-msg">No recent game data found.</div>';
            setAnswer('loading');
        }

        // Series (group most recent opponent run during playoffs)
        if (parsed.length > 0) {
            const finalOpp = parsed[parsed.length-1].opp.name;
            const isPlayoff = parsed[parsed.length-1].isPlayoff;
            if (isPlayoff) {
                const set = parsed.filter(g => g.opp.name === finalOpp && g.isPlayoff);
                if (set.length > 0) renderSeries(set, finalOpp);
            }
            renderGameLog(parsed);
        }

        // Standings (independent fetch)
        loadStandings();

        // Rich data from summary endpoint
        if (latest) {
            const summary = await fetch(SUMMARY_URL(latest.id)).then(r=>r.json()).catch(()=>null);
            if (summary) {
                const headline = summary.headlines?.[0]?.shortLinkText || summary.headlines?.[0]?.description;
                if (headline && !liveEvt) { latest.headline = headline; renderScoreCard(latest, false); renderLineScore(latest.dream.line, latest.opp.line, latest.opp.short, latest.dream.score, latest.opp.score); }

                renderTrend(summary.plays || [], latest.isHome, latest.dream.score ?? 0, latest.opp.score ?? 0, 'ATL', latest.opp.abbrev || latest.opp.short?.slice(0,3).toUpperCase());

                // team stats
                const teams = summary.boxscore?.teams || [];
                const dreamT = teams.find(t => t.team?.id === DREAM_ID);
                const oppT = teams.find(t => t.team?.id !== DREAM_ID);
                if (dreamT && oppT) renderTeamStats(dreamT.statistics, oppT.statistics);

                renderLeaders(summary.leaders);

                if (!liveEvt && latest.dreamWon) showTicker(buildTickerSegments(latest, summary));
            } else {
                renderTrend([], latest.isHome, 0, 0, 'ATL', latest.opp.abbrev);
            }
        }

        document.getElementById('updated-at').textContent = `Updated ${new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}`;
    } catch (err) {
        console.error(err);
        document.getElementById('score-card').innerHTML = '<div class="error-msg">Couldn\'t load game data — check back soon.</div>';
        setAnswer('loading');
    }
}

load();
setInterval(load, 60_000);
window.addEventListener('resize', () => { const c=document.getElementById('confetti'); c.width=window.innerWidth; c.height=window.innerHeight; if (trendState) positionTrend(trendState.curIdx); });
</script>
